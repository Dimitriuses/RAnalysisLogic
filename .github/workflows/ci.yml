name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logic-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: logic-sim/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: PyZ3Server/requirements-dev.txt
      - run: pip install -r PyZ3Server/requirements-dev.txt
      - run: ruff check PyZ3Server
      - run: python -m pytest PyZ3Server
