name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Typecheck, unit tests and a production build, on both platforms the project
  # is actually developed and deployed on.
  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: logic-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must stay >= 20.19 / 22.12 for Vite 7. The lockfile is generated
          # with the npm this bundles (npm 10.x) — see CLAUDE.md, regenerating
          # it with a newer npm has produced a lockfile `npm ci` here rejects.
          node-version: 22
          cache: npm
          cache-dependency-path: logic-sim/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build

  # Starts the built app in a real browser and exercises the paths the hosted
  # demo advertises, so "the demo works" is a check mark rather than a claim.
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logic-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: logic-sim/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the production build
        run: npx vite preview --port 4173 --strictPort &
      - name: Wait for the preview server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "preview server never came up"; exit 1
      - run: npm run smoke

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.10 is the floor the code targets; 3.13 is what it is developed on.
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: PyZ3Server/requirements-dev.txt
      - run: pip install -r PyZ3Server/requirements-dev.txt
      - run: ruff check PyZ3Server
      # Run from the repo root: server.py imports `PyZ3Server.*` as a package.
      - run: python -m pytest PyZ3Server
