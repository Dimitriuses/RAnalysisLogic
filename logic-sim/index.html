<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>
  <body>
    <input type="file" id="fileInput" />
    <div>
      <label for="bitInput">Input bits:</label>
      <input type="text" id="bitInput" size="80" />
      <button id="applyInputs">Set Inputs</button>
      <button id="downloadBtn">Download JSON</button>
    </div>
    <div>
      <label for="bitOutput">Output bits:</label>
      <input type="text" id="bitOutput" size="80" />
      <button id="applyOutputs">Set Outputs</button>
      <button id="solveBtn">Solve</button>
      <button id="solveOutputsBtn">Solve (fix outputs)</button>
    </div>
    <select id="solutionSelector"></select>
    <div id="app"></div>
    <div id="modulePreviewModal" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="modal-header">
          <span id="modulePreviewTitle"></span>
          <button id="closeModulePreview">&times;</button>
        </div>
        <div class="modal-tabs">
          <button id="previewTabGraph" class="modal-tab active">Graph</button>
          <button id="previewTabTable" class="modal-tab">Truth Table</button>
        </div>
        <div id="modulePreviewContainer" class="modal-graph"></div>
        <div id="modulePreviewTableContainer" class="modal-table hidden"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
